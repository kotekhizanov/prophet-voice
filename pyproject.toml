[project]
name = "prophet-voice"
version = "0.7.0"
description = "prophet-voice: talk to Prophet aloud, a client with a key from Settings → Clients"
readme = "README.md"
requires-python = ">=3.12"
# What it needs to hear and speak is the "audio" extra (install.sh installs it).
# Without it the package still loads, so the tests run anywhere, CI too.
dependencies = [
    "httpx>=0.28",
    "numpy>=1.26",
    "num2words>=0.5.13",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.5",
    "vosk>=0.3.44,!=0.3.45",  # 0.3.45 has no wheel for macOS
    "faster-whisper>=1.1",
    "av<19",  # faster-whisper 1.2.1 passes av.open() an argument PyAV 19 dropped
    "torch>=2.5",
    "scipy>=1.14",  # Silero's model imports it
    "sherpa-onnx>=1.12",  # telling voices apart
    "transformers>=5.22",  # Nemotron 3 Diarization, the other way to
    "librosa>=0.10",  # Nemotron's features
]

[project.scripts]
prophet-voice = "prophet_voice.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prophet_voice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["prophet_voice"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
